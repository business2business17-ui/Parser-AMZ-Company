name: Tests
on:
  push:
    paths: ['**.py', 'requirements.txt', 'config.json', '.github/workflows/tests.yml']
  pull_request:
    paths: ['**.py', 'requirements.txt', 'config.json', '.github/workflows/tests.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
