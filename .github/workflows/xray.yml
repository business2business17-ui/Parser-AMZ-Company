name: Process Xray

on:
  workflow_dispatch:
    inputs:
      marketplace:
        description: 'Fallback marketplace (US, DE, UK, etc.). Empty = config / file / URL'
        required: false
        default: ''
        type: string
      max_pages:
        description: 'Storefront pages per seller'
        required: true
        default: '3'
        type: string
      max_products:
        description: 'Maximum storefront ASINs per seller (seeds are also included)'
        required: true
        default: '100'
        type: string

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      XRAY_MARKETPLACE: ${{ inputs.marketplace }}
      XRAY_MAX_PAGES: ${{ inputs.max_pages }}
      XRAY_MAX_PRODUCTS: ${{ inputs.max_products }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Xray exports
        shell: bash
        run: |
          args=(--validate-only --out reports --max-pages "$XRAY_MAX_PAGES" --max-products "$XRAY_MAX_PRODUCTS")
          if [[ -n "$XRAY_MARKETPLACE" ]]; then args+=(--marketplace "$XRAY_MARKETPLACE"); fi
          python agent.py "${args[@]}"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Create XLSX reports
        shell: bash
        run: |
          args=(--headless --out reports --max-pages "$XRAY_MAX_PAGES" --max-products "$XRAY_MAX_PRODUCTS")
          if [[ -n "$XRAY_MARKETPLACE" ]]; then args+=(--marketplace "$XRAY_MARKETPLACE"); fi
          python agent.py "${args[@]}"
      - name: Downloadable results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
